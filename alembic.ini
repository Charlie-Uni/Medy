# Alembic configuration (baseline 4.1 `migrations/`, M1-06). The database URL is never stored here:
# migrations/env.py takes MEDOPS_MIGRATION_URL when set (integration tests), otherwise the admin DSN
# from Settings (.env DATABASE_ADMIN_URL, falling back to DATABASE_URL). Application traffic uses the
# restricted role's DATABASE_URL; only migrations run as the admin role (baseline 3.7).
[alembic]
script_location = migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = src
path_separator = os
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
