name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MEDOPS_TEST_REQUIRED_SERVICES: "1"
      # integration tests create and drop throwaway databases through this admin DSN (tests/integration/conftest.py)
      MEDOPS_TEST_ADMIN_URL: postgresql://medops_admin:ci-only-password@localhost:5432/medops
      MEDOPS_TEST_REDIS_URL: redis://localhost:6379/0
      MEDOPS_TEST_PG_CONTAINER: medy-ci-postgres
    steps:
      - uses: actions/checkout@v4
      - name: start required PostgreSQL and Redis with cached image pulls
        shell: bash
        run: |
          set -euo pipefail
          # Configure the daemon before pulling: the Google cache serves the same digest and falls back
          # to Docker Hub on a cache miss. Actions services start before steps, preventing this recovery.
          sudo python3 - <<'PY'
          import json
          from pathlib import Path
          daemon_path = Path('/etc/docker/daemon.json')
          config = json.loads(daemon_path.read_text()) if daemon_path.exists() else {}
          mirrors = config.get('registry-mirrors', [])
          config['registry-mirrors'] = ['https://mirror.gcr.io'] + [
              m for m in mirrors if m.rstrip('/') != 'https://mirror.gcr.io'
          ]
          daemon_path.write_text(json.dumps(config) + '\n')
          PY
          sudo systemctl restart docker
          docker info --format '{{json .RegistryConfig.Mirrors}}' | python3 -c \
            'import json,sys; mirrors=json.load(sys.stdin); assert any(m.rstrip("/")=="https://mirror.gcr.io" for m in mirrors); print("mirror config loaded")'
          docker info --format '{{json .DriverStatus}}'
          curl --connect-timeout 10 --max-time 30 -fsS \
            -H 'Accept: application/vnd.oci.image.index.v1+json' \
            'https://mirror.gcr.io/v2/pgvector/pgvector/manifests/sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d' \
            -o /tmp/medy-ci-postgres-manifest.json
          echo 'ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d  /tmp/medy-ci-postgres-manifest.json' | sha256sum -c -
          # Public images need no runner-provided Docker Hub login. Use a dedicated empty client config.
          mkdir -p /tmp/medy-ci-docker-public
          echo '{}' > /tmp/medy-ci-docker-public/config.json
          for service_image in \
            'pgvector/pgvector:pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d' \
            'redis:7.2-alpine'; do
            pulled=no
            for pull_attempt in 1 2 3; do
              if timeout 120s docker --config /tmp/medy-ci-docker-public pull "$service_image"; then pulled=yes; break; fi
              sleep "$((pull_attempt * 5))"
            done
            test "$pulled" = yes
          done
          docker run -d --name medy-ci-postgres -p 127.0.0.1:5432:5432 \
            -e POSTGRES_DB=medops -e POSTGRES_USER=medops_admin -e POSTGRES_PASSWORD=ci-only-password \
            --health-cmd 'pg_isready -U medops_admin -d medops' \
            --health-interval 2s --health-timeout 5s --health-retries 12 \
            pgvector/pgvector:pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
          # Keep the existing 7.2 line (BSD-3-Clause); no test may silently skip a required dependency.
          docker run -d --name medy-ci-redis -p 127.0.0.1:6379:6379 \
            --health-cmd 'redis-cli ping' --health-interval 2s --health-timeout 3s --health-retries 12 \
            redis:7.2-alpine
          for service_container in medy-ci-postgres medy-ci-redis; do
            healthy=no
            for health_attempt in $(seq 1 45); do
              if test "$(docker inspect --format '{{.State.Health.Status}}' "$service_container")" = healthy; then
                healthy=yes
                break
              fi
              sleep 1
            done
            if test "$healthy" != yes; then docker logs "$service_container"; exit 1; fi
          done
      - name: install pinned pg_textsearch 1.5.1 into PostgreSQL 17 service
        shell: bash
        run: |
          set -euo pipefail
          archive=/tmp/pg-textsearch-v1.5.1-pg17-amd64.zip
          deb=/tmp/pg-textsearch-postgresql-17_1.5.1-1_amd64.deb
          curl -fsSL https://github.com/timescale/pg_textsearch/releases/download/v1.5.1/pg-textsearch-v1.5.1-pg17-amd64.zip -o "$archive"
          echo "ed4410e8b6879a8971cd87fd03853f182e47b85b199c9bfcd9b34f159caba9fb  $archive" | sha256sum -c -
          unzip -p "$archive" pg-textsearch-postgresql-17_1.5.1-1_amd64.deb > "$deb"
          echo "357d27e5a1a8b6131f89851daf7ec47c2a6419a7f0f5bcfa08860b31334e804d  $deb" | sha256sum -c -
          postgres_cid=$(docker ps --filter publish=5432 --format '{{.ID}}')
          test -n "$postgres_cid"
          docker cp "$deb" "$postgres_cid":/tmp/pg_textsearch.deb
          docker exec "$postgres_cid" dpkg -i /tmp/pg_textsearch.deb
          docker exec "$postgres_cid" psql -U medops_admin -d medops -v ON_ERROR_STOP=1 -c "alter system set shared_preload_libraries='pg_textsearch'"
          docker restart "$postgres_cid"
          for attempt in $(seq 1 30); do
            if docker exec "$postgres_cid" pg_isready -U medops_admin -d medops; then break; fi
            sleep 1
          done
          docker exec "$postgres_cid" psql -U medops_admin -d medops -Atc "show shared_preload_libraries" | grep -Fx pg_textsearch
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "pip==26.2.1"
      - run: python -m pip install --no-cache-dir --require-hashes -r requirements-build.lock
      - run: python -m pip install --no-cache-dir --no-build-isolation -r requirements.lock
      - run: python -m pip install --no-build-isolation --no-deps -e .
      - run: python -m pip check
      - name: package importable outside the repo
        run: cd /tmp && python -c "import medops.evals.probe.validator"
      - run: make PY=python lint format-check
      - run: python -m mypy
      - name: architecture import boundaries
        run: make PY=python architecture-check
      - name: test assertion discrimination
        run: make PY=python test-assertion-check
      - run: python -m pytest -q
      - name: frozen evaluation inputs and lineage
        run: make PY=python eval-check
      - name: migration check (single head, upgrade/downgrade round trip)
        run: |
          test "$(python -m alembic heads | wc -l | tr -d ' ')" = "1"
          python -m pytest -q tests/integration/test_migrations.py -k "round_trip or single_head"
      - run: python -m medops.contracts_export --out schemas --check
      - name: probe examples validate as draft
        run: |
          mkdir -p /tmp/probe-draft
          cp evals/probe/precise_clause/examples/manifest.example.json /tmp/probe-draft/manifest.json
          cp evals/probe/precise_clause/examples/corpus.example.json /tmp/probe-draft/corpus.json
          cp evals/probe/precise_clause/examples/samples.example.jsonl /tmp/probe-draft/samples.jsonl
          cp evals/probe/precise_clause/examples/review_prompt.example.md /tmp/probe-draft/review_prompt.md
          python -m medops.evals.probe /tmp/probe-draft --mode draft
      - name: build the exact production runtime image
        run: docker build --tag medops-copilot:ci .
      - name: cache pinned public BGE model files (no secrets or corpus)
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/medy-models
          key: medy-bge-models-${{ hashFiles('src/medops/retrieval/vector/embedding.py', 'src/medops/retrieval/rerank.py', 'scripts/ci_download_models.py') }}
      - name: prefetch pinned models through the runtime image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/medy-models"
          # Cache files are public. Download as the runner UID so Actions can save/restore them.
          docker run --rm --user "$(id -u):$(id -g)" \
            --mount "type=bind,source=$RUNNER_TEMP/medy-models,target=/models" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/scripts/ci_download_models.py,target=/app/ci_download_models.py,readonly" \
            medops-copilot:ci python /app/ci_download_models.py
      - name: real container boot with published policy and readiness failure
        env:
          MEDOPS_TEST_RUNTIME_IMAGE: medops-copilot:ci
          MEDOPS_TEST_MODEL_CACHE: ${{ runner.temp }}/medy-models
          MEDOPS_TEST_CONTAINER_DB_HOST: medy-ci-postgres
          MEDOPS_TEST_CONTAINER_NETWORK: medy-ci-runtime
        shell: bash
        run: |
          set -euo pipefail
          docker network create --internal medy-ci-runtime
          docker network connect medy-ci-runtime medy-ci-postgres
          make PY=python ci-container-check
      - name: remove CI services
        if: always()
        run: |
          runtime_ids=$(docker ps -aq --filter label=medy.ci-runtime=1)
          if test -n "$runtime_ids"; then docker rm -f $runtime_ids; fi
          docker rm -f medy-ci-postgres medy-ci-redis || true
          docker network rm medy-ci-runtime || true
