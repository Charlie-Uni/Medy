# MedOps Copilot local infrastructure (baseline M0-11, minimal form).
# The fact plane and cache always run; the application services (api, worker, mcp) are behind the `app`
# profile (M3-12). Object storage waits for DEC-007. Ports bind to localhost only. Passwords come from .env.
name: medops

services:
  postgres:
    # ADR-0002 revision 6: PostgreSQL 17 + pgvector + pinned pg_textsearch 1.5.1.
    # A new PG17 volume is intentional; migrate the PG16 data by logical dump/restore (docs/OPERATIONS.md).
    build:
      context: .
      dockerfile: deploy/postgres/Dockerfile.pg17-bm25
    image: medy-postgres:pg17-pgtextsearch-1.5.1
    container_name: medops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medops}
      POSTGRES_USER: ${POSTGRES_USER:-medops_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres17_data:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medops_admin} -d ${POSTGRES_DB:-medops}"]
      interval: 5s
      timeout: 5s
      retries: 12
    stop_grace_period: 30s

  redis:
    # Redis 7.2 line (BSD-3-Clause); 7.4+ is RSALv2/SSPLv1 and was rejected by the owner on 2026-09-17
    # (implementation record 15). Digest is the multi-arch index of `redis:7.2-alpine` resolved that day
    # (7.2.16-alpine); bump tag and digest together, never the tag alone.
    image: redis:7.2-alpine@sha256:ccd6aa8d45ff3f033d6fa15b8cc1a50579f65c89f38cf9bb607a954c4f2128ed
    container_name: medops-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}


  # ---- application services (M3-12): `docker compose --profile app up -d --build`. Same image, three entry points.
  api:
    build: .
    image: medops-copilot:dev
    container_name: medops-api
    profiles: ["app"]
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:-${DATABASE_URL}}
      DATABASE_ADMIN_URL: ${DATABASE_ADMIN_URL_DOCKER:-${DATABASE_ADMIN_URL:-}}
      DATABASE_READONLY_URL: ${DATABASE_READONLY_URL_DOCKER:-${DATABASE_READONLY_URL:-}}
      REDIS_URL: ${REDIS_URL_DOCKER:-${REDIS_URL}}
      MODEL_CACHE_DIR: /models
    command: ["python", "-m", "medops.api.serve", "--host", "0.0.0.0", "--port", "8000", "--device", "cpu"]
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - model_cache:/models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 120s
    stop_grace_period: 30s

  worker:
    build: .
    image: medops-copilot:dev
    container_name: medops-worker
    profiles: ["app"]
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:-${DATABASE_URL}}
      DATABASE_ADMIN_URL: ${DATABASE_ADMIN_URL_DOCKER:-${DATABASE_ADMIN_URL:-}}
      REDIS_URL: ${REDIS_URL_DOCKER:-${REDIS_URL}}
      MODEL_CACHE_DIR: /models
    command: ["python", "-m", "medops.worker.serve", "--device", "cpu"]
    volumes:
      - model_cache:/models
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 30s

  # Shared candidate-cache invalidation is a separate durable outbox consumer. Its explicit database argument
  # prevents an operator DSN from silently selecting the wrong corpus; API/MCP and this worker share a namespace.
  retrieval-cache-worker:
    build: .
    image: medops-copilot:dev
    container_name: medops-retrieval-cache-worker
    profiles: ["app"]
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_ADMIN_URL: ${DATABASE_ADMIN_URL_DOCKER:-${DATABASE_ADMIN_URL:-}}
      REDIS_URL: ${REDIS_URL_DOCKER:-${REDIS_URL}}
    command:
      [
        "python",
        "-m",
        "medops.worker.retrieval",
        "--database",
        "${RETRIEVAL_CACHE_DATABASE:?set RETRIEVAL_CACHE_DATABASE in .env}",
        "--consumer",
        "retrieval-cache",
      ]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from psycopg import connect; from psycopg.conninfo import make_conninfo; from medops.core.config import Settings; from medops.infrastructure.cache import RedisCandidateCacheStore; s=Settings(); RedisCandidateCacheStore.from_settings(s).ping(); c=connect(make_conninfo(s.database_admin_url.get_secret_value(), dbname=s.retrieval_cache_database), connect_timeout=s.db_connect_timeout_s); c.execute('select 1').fetchone(); c.close()",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    stop_grace_period: 30s

  mcp:
    build: .
    image: medops-copilot:dev
    container_name: medops-mcp
    profiles: ["app"]
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:-${DATABASE_URL}}
      DATABASE_READONLY_URL: ${DATABASE_READONLY_URL_DOCKER:-${DATABASE_READONLY_URL:-}}
      REDIS_URL: ${REDIS_URL_DOCKER:-${REDIS_URL}}
      MODEL_CACHE_DIR: /models
    command: ["python", "-m", "medops.mcp.serve", "--transport", "streamable-http", "--host", "0.0.0.0", "--port", "8001", "--device", "cpu"]
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - model_cache:/models
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 30s

  jaeger:
    # Trace viewer for the OTLP spans the API / worker / MCP already emit (record 123). Apache-2.0, one container,
    # in-memory storage: for looking at call chains on a workstation, not a retention store. Spans carry structure
    # only (node, model, tokens, cost, versions) — never prompts, evidence or answers (INV-OBS-03).
    # Start with `make observability-up`, then set OTEL_EXPORTER_OTLP_ENDPOINT=http://127.0.0.1:4318 in .env.
    image: jaegertracing/jaeger:2.4.0
    container_name: medops-jaeger
    profiles: ["observability"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:16686:16686" # UI
      - "127.0.0.1:4318:4318" # OTLP/HTTP
    stop_grace_period: 10s

volumes:
  postgres17_data:
    name: medops_postgres17_data
    external: true
  redis_data:
  model_cache:
