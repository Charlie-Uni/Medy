# MedOps Copilot local infrastructure (baseline M0-11, minimal form).
# The fact plane and cache always run; the application services (api, worker, mcp) are behind the `app`
# profile (M3-12). Object storage waits for DEC-007. Ports bind to localhost only. Passwords come from .env.
name: medops

# Shared deployment contract; each supervised service has its own state directory and restart boundary.
x-supervised-worker: &supervised-worker
  build: .
  image: medops-copilot:dev
  restart: unless-stopped
  init: true
  env_file: .env
  mem_limit: 256m
  cpus: 0.5
  pids_limit: 64
  depends_on:
    postgres:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "python", "-m", "medops.worker.supervision", "--check"]
    interval: 10s
    timeout: 3s
    retries: 3
    start_period: 300s
  stop_grace_period: 30s

services:
  postgres:
    # ADR-0002 revision 6: PostgreSQL 17 + pgvector + pinned pg_textsearch 1.5.1.
    # A new PG17 volume is intentional; migrate the PG16 data by logical dump/restore (docs/OPERATIONS.md).
    build:
      context: .
      dockerfile: deploy/postgres/Dockerfile.pg17-bm25
    image: medy-postgres:pg17-pgtextsearch-1.5.1
    container_name: medops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medops}
      POSTGRES_USER: ${POSTGRES_USER:-medops_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres17_data:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medops_admin} -d ${POSTGRES_DB:-medops}"]
      interval: 5s
      timeout: 5s
      retries: 12
    stop_grace_period: 30s

  redis:
    # Redis 7.2 line (BSD-3-Clause); 7.4+ is RSALv2/SSPLv1 and was rejected by the owner on 2026-09-17
    # (implementation record 15). Digest is the multi-arch index of `redis:7.2-alpine` resolved that day
    # (7.2.16-alpine); bump tag and digest together, never the tag alone.
    image: redis:7.2-alpine@sha256:ccd6aa8d45ff3f033d6fa15b8cc1a50579f65c89f38cf9bb607a954c4f2128ed
    container_name: medops-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}


  # ---- application services (M3-12): `docker compose --profile app up -d --build`. Same image, three entry points.
  api:
    build: .
    image: medops-copilot:dev
    container_name: medops-api
    profiles: ["app"]
    restart: unless-stopped
    init: true
    mem_limit: 8g
    cpus: 2.0
    pids_limit: 128
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:-${DATABASE_URL}}
      DATABASE_ADMIN_URL: ${DATABASE_ADMIN_URL_DOCKER:-${DATABASE_ADMIN_URL:-}}
      DATABASE_READONLY_URL: ${DATABASE_READONLY_URL_DOCKER:-${DATABASE_READONLY_URL:-}}
      REDIS_URL: ${REDIS_URL_DOCKER:-${REDIS_URL}}
      MODEL_CACHE_DIR: /models
      GLOSSARY_DIR: /app/glossary
    command: ["python", "-m", "medops.api.serve", "--host", "0.0.0.0", "--port", "8000", "--device", "cpu"]
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - model_cache:/models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 120s
    stop_grace_period: 30s

  worker:
    <<: *supervised-worker
    container_name: medops-worker
    profiles: ["app"]
    mem_limit: 8g
    cpus: 2.0
    pids_limit: 128
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:-${DATABASE_URL}}
      DATABASE_ADMIN_URL: ${DATABASE_ADMIN_URL_DOCKER:-${DATABASE_ADMIN_URL:-}}
      REDIS_URL: ${REDIS_URL_DOCKER:-${REDIS_URL}}
      MODEL_CACHE_DIR: /models
      GLOSSARY_DIR: /app/glossary
    command: ["python", "-m", "medops.worker.supervision", "--kind", "tasks", "--stall", "400", "--grace", "140", "--", "--device", "cpu"]
    volumes:
      - model_cache:/models
    stop_grace_period: 150s

  # Shared candidate-cache invalidation is a separate durable outbox consumer. Its explicit database argument
  # prevents an operator DSN from silently selecting the wrong corpus; API/MCP and this worker share a namespace.
  retrieval-cache-worker:
    <<: *supervised-worker
    container_name: medops-retrieval-cache-worker
    profiles: ["app"]
    pids_limit: 128
    environment:
      DATABASE_ADMIN_URL: ${DATABASE_ADMIN_URL_DOCKER:-${DATABASE_ADMIN_URL:-}}
      REDIS_URL: ${REDIS_URL_DOCKER:-${REDIS_URL}}
    command: ["python", "-m", "medops.worker.supervision", "--kind", "retrieval", "--stall", "90", "--", "--database", "${RETRIEVAL_CACHE_DATABASE:?set RETRIEVAL_CACHE_DATABASE in .env}", "--consumer", "retrieval-cache"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  mcp:
    build: .
    image: medops-copilot:dev
    container_name: medops-mcp
    profiles: ["app"]
    restart: unless-stopped
    init: true
    mem_limit: 8g
    cpus: 2.0
    pids_limit: 128
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:-${DATABASE_URL}}
      DATABASE_READONLY_URL: ${DATABASE_READONLY_URL_DOCKER:-${DATABASE_READONLY_URL:-}}
      REDIS_URL: ${REDIS_URL_DOCKER:-${REDIS_URL}}
      MODEL_CACHE_DIR: /models
      GLOSSARY_DIR: /app/glossary
    command: ["python", "-m", "medops.mcp.serve", "--transport", "streamable-http", "--host", "0.0.0.0", "--port", "8001", "--device", "cpu"]
    ports:
      - "127.0.0.1:8001:8001"
    # Override the image's API:8000 healthcheck; this proves MCP socket liveness, not index readiness.
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1',8001), timeout=3).close()"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 300s
    volumes:
      - model_cache:/models
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 30s

  lexical-index-worker:
    <<: *supervised-worker
    profiles: ["app"]
    mem_limit: 512m
    cpus: 1.0
    environment:
      DATABASE_ADMIN_URL: ${DATABASE_ADMIN_URL_DOCKER:-${DATABASE_ADMIN_URL:-}}
    command: ["python", "-m", "medops.worker.supervision", "--kind", "retrieval", "--stall", "90", "--", "--database", "${RETRIEVAL_CACHE_DATABASE:?set RETRIEVAL_CACHE_DATABASE in .env}", "--consumer", "lexical-index", "--batch", "1"]

  vector-index-worker:
    <<: *supervised-worker
    profiles: ["app"]
    mem_limit: 4g
    cpus: 2.0
    pids_limit: 128
    environment:
      DATABASE_ADMIN_URL: ${DATABASE_ADMIN_URL_DOCKER:-${DATABASE_ADMIN_URL:-}}
      MODEL_CACHE_DIR: /models
    command: ["python", "-m", "medops.worker.supervision", "--kind", "retrieval", "--", "--database", "${RETRIEVAL_CACHE_DATABASE:?set RETRIEVAL_CACHE_DATABASE in .env}", "--consumer", "vector-index", "--device", "cpu", "--batch", "1"]
    volumes:
      - model_cache:/models

  score-sync-worker:
    <<: *supervised-worker
    profiles: ["score-sync"]
    environment:
      DATABASE_LOOP_URL: ${DATABASE_LOOP_URL_DOCKER:-${DATABASE_LOOP_URL:-}}
      DATABASE_ADMIN_URL: ${DATABASE_ADMIN_URL_DOCKER:-${DATABASE_ADMIN_URL:-}}
    command: ["python", "-m", "medops.worker.supervision", "--kind", "scores", "--stall", "180", "--", "--database", "${RETRIEVAL_CACHE_DATABASE:?set RETRIEVAL_CACHE_DATABASE in .env}", "--queue", "/queue/scores.sqlite3", "--batch", "10"]
    volumes:
      - score_queue:/queue

  payload-retention:
    <<: *supervised-worker
    profiles: ["maintenance"]
    environment:
      DATABASE_RESTRICTED_URL: ${DATABASE_RESTRICTED_URL_DOCKER:-${DATABASE_RESTRICTED_URL:-}}
    command: ["python", "-m", "medops.worker.supervision", "--kind", "maintenance", "--interval", "86400", "--", "--database", "${RETRIEVAL_CACHE_DATABASE:?set RETRIEVAL_CACHE_DATABASE in .env}", "--job", "payload-retention"]

  audit-retention:
    <<: *supervised-worker
    profiles: ["maintenance"]
    environment:
      DATABASE_ADMIN_URL: ${DATABASE_ADMIN_URL_DOCKER:-${DATABASE_ADMIN_URL:-}}
    command: ["python", "-m", "medops.worker.supervision", "--kind", "maintenance", "--interval", "604800", "--", "--database", "${RETRIEVAL_CACHE_DATABASE:?set RETRIEVAL_CACHE_DATABASE in .env}", "--job", "audit-retention"]

  loop-observe:
    <<: *supervised-worker
    profiles: ["loop-observe"]
    environment:
      DATABASE_LOOP_URL: ${DATABASE_LOOP_URL_DOCKER:-${DATABASE_LOOP_URL:-}}
    # Scan all retained signals: a moving created_at window would lose late feedback on an old trace.
    command: ["python", "-m", "medops.worker.supervision", "--kind", "maintenance", "--interval", "300", "--", "--database", "${RETRIEVAL_CACHE_DATABASE:?set RETRIEVAL_CACHE_DATABASE in .env}", "--job", "loop-observe", "--since", "1970-01-01"]

  jaeger:
    # Trace viewer for the OTLP spans the API / worker / MCP already emit (record 123). Apache-2.0, one container,
    # in-memory storage: for looking at call chains on a workstation, not a retention store. Spans carry structure
    # only (node, model, tokens, cost, versions) — never prompts, evidence or answers (INV-OBS-03).
    # Start with `make observability-up`, then set OTEL_EXPORTER_OTLP_ENDPOINT=http://127.0.0.1:4318 in .env.
    image: jaegertracing/jaeger:2.4.0
    container_name: medops-jaeger
    profiles: ["observability"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:16686:16686" # UI
      - "127.0.0.1:4318:4318" # OTLP/HTTP
    stop_grace_period: 10s

volumes:
  postgres17_data:
    name: medops_postgres17_data
    external: true
  redis_data:
  model_cache:
  score_queue:
